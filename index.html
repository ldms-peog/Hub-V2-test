function renderHome(updateHistory=true){if(updateHistory)setHash('',true);const doors=CONFIG.DOORS.map(d=>`<${d.external?'a':'button'} class="door" style="--accent:${d.accent}" ${d.external?`href="${CONFIG.LINKS.ai_garage}" target="_blank" rel="noopener"`:`data-door="${d.key}"`}><span class="door-num">${d.number}</span><h2>${d.title}</h2><p>${d.question}</p>${d.external?`<span class="outbound-note">${CONFIG.UI.leaveHub}</span>`:''}<span class="door-arrow">${d.external?'↗':'→'}</span></${d.external?'a':'button'}>`).join('');view.innerHTML=`<section class="landing" aria-labelledby="landing-title"><h1 id="landing-title">${CONFIG.UI.landingQuestion}</h1><p class="intro">${CONFIG.UI.landingIntro}</p><div class="doors">${doors}</div><p class="landing-help">Prefer to search? <button class="text-button" id="landing-search">Ctrl / Cmd K</button>.</p></section>`;view.querySelectorAll('[data-door]').forEach(b=>b.onclick=()=>renderSection(b.dataset.door));$('#landing-search').onclick=openPalette;view.focus()}
function renderSection(key,updateHistory=true){const door=CONFIG.DOORS.find(d=>d.key===key),copy=CONFIG.UI.sectionCopy[key];if(!door||!copy)return renderHome(updateHistory);if(updateHistory)setHash(key);view.innerHTML=`<section class="section" style="--accent:${door.accent}" aria-labelledby="section-title"><button class="control back" id="back-home">← ${CONFIG.UI.back}</button><div class="section-header"><div><p class="eyebrow">${door.number} / CISO AI Hub</p><h1 id="section-title">${door.title}</h1><p class="section-copy">${copy}</p></div><span class="section-helper">${helper(door.helper,'soon')}</span></div><div class="section-note">${CONFIG.UI.sectionNote}</div></section>`;$('#back-home').onclick=()=>renderHome();view.focus()}
function indexItems(){const withAccess=CONFIG.TOOLS.flatMap(tool=>[{name:tool.name,type:'Tools',action:()=>renderSection('start')},{name:`Get access to ${tool.name}`,type:'Tools',detail:tool.accessRoute,action:()=>renderSection('start')}]);return [...withAccess,...CONFIG.STEPS.map(s=>({name:s.name,type:'Lifecycle',action:()=>renderSection('build')})),...CONFIG.AMBASSADORS.map(p=>({name:p.name,type:'People',detail:'AI Ambassador',action:()=>renderSection('help')})),...CONFIG.PSL_LIST.map(p=>({name:p.lead,type:'People',detail:p.label,action:()=>renderSection('help')})),...CONFIG.EXISTING_USE_CASES.map(u=>({name:u.name,type:'Use cases',detail:u.id,action:()=>renderSection('build')})),{name:'Learning Advisor',type:'Training',action:()=>renderSection('learn')},{name:'AI training paths',type:'Training',action:()=>renderSection('learn')}];}
function renderResults(){const groups=CONFIG.UI.searchGroups;const markup=groups.map(type=>{const entries=currentItems.filter(i=>i.type===type);return entries.length?`<div class="result-group">${type}</div>${entries.map(item=>`<button class="result ${item===currentItems[selected]?'selected':''}" role="option" aria-selected="${item===currentItems[selected]}" data-id="${currentItems.indexOf(item)}"><strong>${item.name}</strong><span>${item.detail||item.type}</span></button>`).join('')}`:''}).join('');results.innerHTML=markup||`<div class="result-empty">${helper('magnifier','soon')}<span>${CONFIG.UI.emptySearch}</span></div>`;results.querySelectorAll('.result').forEach(b=>b.onclick=()=>activate(Number(b.dataset.id)))}
function updateResults(){const term=input.value.trim().toLowerCase();currentItems=indexItems().filter(i=>!term||`${i.name} ${i.type} ${i.detail||''}`.toLowerCase().includes(term)).slice(0,20);selected=Math.min(selected,Math.max(0,currentItems.length-1));renderResults()}
function activate(index){const item=currentItems[index];if(!item)return;closePalette();item.action()}
function openPalette(){lastFocus=document.activeElement;palette.hidden=false;input.value='';selected=0;updateResults();setTimeout(()=>input.focus(),0)}function closePalette(){palette.hidden=true;lastFocus?.focus()}function loadRoute(){const key=location.hash.replace('#','');key&&key!=='home'?renderSection(key,false):renderHome(false)}
$('#footer-meta').textContent=CONFIG.UI.footerMeta;$('#wordmark').textContent=CONFIG.UI.wordmark;$('#open-palette').onclick=openPalette;$('#home-link').onclick=e=>{e.preventDefault();renderHome()};input.oninput=()=>{selected=0;updateResults()};window.addEventListener('popstate',loadRoute);document.addEventListener('keydown',e=>{if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='k'){e.preventDefault();openPalette();return}if(palette.hidden)return;if(e.key==='Escape'){e.preventDefault();closePalette()}else if(e.key==='ArrowDown'||e.key==='ArrowUp'){e.preventDefault();if(currentItems.length){selected=(selected+(e.key==='ArrowDown'?1:-1)+currentItems.length)%currentItems.length;renderResults()}}else if(e.key==='Enter'){e.preventDefault();activate(selected)}});loadRoute();
</script></body></html>
