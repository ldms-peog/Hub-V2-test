<style>

*{box-sizing:border-box}html{background:var(--bg)}body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.65 "Segoe UI",system-ui,-apple-system,BlinkMacSystemFont,sans-serif;min-height:100vh}button,a,input{font:inherit}button{color:inherit}button,a{outline-offset:4px}button:focus-visible,a:focus-visible,input:focus-visible{outline:2px solid var(--teal)}

@media(max-width:900px){.app-shell{padding:22px 24px 35px}.landing{padding:58px 0}.doors{grid-template-columns:1fr}.landing-intro{margin-bottom:38px}.command-trigger{gap:10px}.command-trigger kbd{display:none}}@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation-duration:.01ms!important;transition-duration:.01ms!important}}

const $=selector=>document.querySelector(selector), view=$('#view'), palette=$('#palette'), input=$('#palette-input'), results=$('#palette-results');let selected=0,lastFocus=null;
function helper(accessory='clipboard',state='beta') {const accessoryPath={clipboard:'<rect x="25" y="31" width="12" height="16" rx="1" fill="#0F1828" stroke="#8593AC"/><path d="M29 29h4M28 37h6M28 41h6" stroke="#E9EEF8" stroke-width="1"/>',magnifier:'<circle cx="31" cy="38" r="6" fill="none" stroke="#0F1828" stroke-width="3"/><path d="m35 43 5 5" stroke="#0F1828" stroke-width="3"/>',wrench:'<path d="M28 32a7 7 0 0 0 7 9l7 8 4-4-8-7a7 7 0 0 0-10-6Z" fill="#8593AC" stroke="#0F1828" stroke-width="1.5"/>',book:'<path d="M25 33c5-3 9 0 9 0v15s-4-3-9 0V33Zm9 0c5-3 9 0 9 0v15c-5-3-9 0-9 0V33Z" fill="#8593AC" stroke="#0F1828" stroke-width="1.4"/>' }[accessory];let muted=state==='soon';return `<svg viewBox="0 0 64 64" aria-hidden="true" style="filter:${muted?'grayscale(1) opacity(.55)':'none'}"><circle class="${state==='beta'?'pulse':''}" cx="27" cy="29" r="23" fill="none" stroke="#FFB547" stroke-width="2"/><rect x="12" y="12" width="30" height="37" rx="15" fill="#FFC83D"/><path d="M14 37c7 6 20 8 28 0v6c-7 7-21 7-28 0v-6Z" fill="#F0A81E" opacity=".9"/><path d="M14 41 7 47M41 41l7 6" stroke="#1E2C45" stroke-width="3" stroke-linecap="round"/><circle cx="27" cy="27" r="12" fill="#8593AC"/><circle class="${state==='live'?'blink':''}" cx="27" cy="27" r="8" fill="#0F1828"/><circle cx="30" cy="24" r="2" fill="#fff"/>${accessoryPath}</svg>`}

function renderSection(key){const section=CONFIG.MESSAGES.sections[key];view.innerHTML=`<section class="section-placeholder" aria-labelledby="section-title"><button class="back" id="back-home">← Back to Hub</button><p class="eyebrow">${String(key).padStart(2,'0')} / CISO AI Hub</p><h1 id="section-title">${section.title}</h1><p>${section.body}</p><div class="section-note">This section will be added after the approved shell. The command palette and Hub navigation are ready.</div></section>`;$('#back-home').onclick=renderHome;view.focus()}
/* Command-palette search index is assembled exclusively from CONFIG. */
function indexItems(){return [...CONFIG.PLATFORMS.map(name=>({name,type:'Tool',action:()=>renderSection('start')})),...CONFIG.STEPS.map(step=>({name:step.name,type:'Lifecycle step',action:()=>renderSection('build')})),...CONFIG.TOOL_CONTACTS.map(p=>({name:p.name,type:p.tool,action:()=>renderSection('help')})),...CONFIG.AMBASSADORS.map(p=>({name:p.name,type:'AI Ambassador',action:()=>renderSection('help')})),...CONFIG.EXISTING_USE_CASES.map(item=>({name:item.name,type:`Use case · ${item.id}`,action:()=>renderSection('build')})),{name:'Learning Advisor',type:'Training',action:()=>renderSection('learn')},{name:'AI training paths',type:'Training',action:()=>renderSection('learn')}];}
function showResults(){let term=input.value.trim().toLowerCase(),items=indexItems().filter(i=>!term||(`${i.name} ${i.type}`).toLowerCase().includes(term)).slice(0,8);selected=Math.min(selected,Math.max(0,items.length-1));results.innerHTML=items.length?items.map((item,i)=>`<button class="result ${i===selected?'selected':''}" role="option" aria-selected="${i===selected}" id="result-${i}" data-index="${i}"><span class="result-icon">${String(i+1).padStart(2,'0')}</span><span><strong>${item.name}</strong><span>${item.type}</span></span></button>`).join(''):`<div class="result-empty">${helper('magnifier','soon')}No matching result. Try a tool, person, training or use case.</div>`;input.setAttribute('aria-activedescendant',items.length?`result-${selected}`:'');results.querySelectorAll('.result').forEach(b=>b.onclick=()=>{let item=items[Number(b.dataset.index)];closePalette();item.action()});return items}
function openPalette(){lastFocus=document.activeElement;palette.hidden=false;selected=0;input.value='';showResults();setTimeout(()=>input.focus(),0)}function closePalette(){palette.hidden=true;if(lastFocus)lastFocus.focus()}$('#open-palette').onclick=openPalette;input.oninput=()=>{selected=0;showResults()};document.addEventListener('keydown',event=>{if((event.ctrlKey||event.metaKey)&&event.key.toLowerCase()==='k'){event.preventDefault();openPalette()}if(!palette.hidden){if(event.key==='Escape'){event.preventDefault();closePalette()}if(event.key==='ArrowDown'||event.key==='ArrowUp'){event.preventDefault();let count=showResults().length;if(count){selected=(selected+(event.key==='ArrowDown'?1:-1)+count)%count;showResults()}}if(event.key==='Enter'){let items=showResults();if(items[selected]){event.preventDefault();closePalette();items[selected].action()}}}});$('#home-link').onclick=event=>{event.preventDefault();renderHome()};renderHome();
</script>
</body>
</html>
