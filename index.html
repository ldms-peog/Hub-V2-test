function findDuplicates(text){let words=(text||'').toLowerCase();return CONFIG.EXISTING_USE_CASES.filter(u=>[u.name,...u.keywords].some(k=>words.includes(k.toLowerCase()))).slice(0,3)}function scoreState(s){let checks={problem_not_solution:s.pain&&hasProblem(s.pain),user_named:s.role,frequency_and_cost:s.frequency&&s.cost,duplicate_checked:s.duplicate,data_ok:s.data&&['C1','C2','C3'].includes(s.classification)&&s.personal==='no',sponsor_named:s.sponsor,outcome_measurable:s.outcome&&/[0-9%]|reduce|increase|improve|minutes|hours/i.test(s.outcome)};let got=CONFIG.SCORE_CRITERIA.filter(c=>checks[c.id]),missing=CONFIG.SCORE_CRITERIA.filter(c=>!checks[c.id]);return {value:got.reduce((n,c)=>n+c.weight,0),missing,checks}}function hasProblem(t){let a=/agent|chatbot|automate|copilot|tool|script|build|dashboard/i.test(t),b=/time|manual|error|wait|repetitive|search|delay|rework|hours|slow/i.test(t);return !a||b}function ambassador(){return CONFIG.AMBASSADORS.find(a=>a.psl===state.psl)}

function opts(values,value){return `<option value="">Select</option>${values.map(x=>`<option value="${esc(typeof x==='string'?x:x.code)}" ${value===(typeof x==='string'?x:x.code)?'selected':''}>${esc(typeof x==='string'?x:x.code+(x.label?' — '+x.label:''))}</option>`).join('')}`}function formOne(){return `<div class="panel"><div class="form-grid"><div class="field full"><label for="pain">Pain point description</label><textarea id="pain">${esc(state.pain)}</textarea></div><div class="field"><label for="role">Affected role or population</label><input id="role" value="${esc(state.role)}"></div><div class="field"><label for="frequency">Frequency</label><select id="frequency">${opts(['daily','weekly','monthly','ad hoc'],state.frequency)}</select></div><div class="field"><label for="cost">Time cost per occurrence in minutes</label><input id="cost" type="number" min="0" value="${esc(state.cost)}"></div><div class="field"><label for="psl">PSL</label><select id="psl">${opts(CONFIG.PSL_LIST,state.psl)}</select></div><div class="field full"><label for="type">Use case type</label><select id="type">${opts(CONFIG.TYPES,state.type)}</select></div></div><div id="nudge"></div><div id="similar"></div></div>`}function formTwo(){return `<div class="panel"><div class="form-grid"><div class="field full"><label for="data">Required data description</label><textarea id="data">${esc(state.data)}</textarea></div><div class="field"><label for="classification">Data classification</label><select id="classification">${opts(['C1','C2','C3','C4','not sure'],state.classification)}</select></div><div class="field"><label for="personal">Personal data</label><select id="personal">${opts(['yes','no','not sure'],state.personal)}</select></div><div class="field"><label for="platform">Target platform</label><select id="platform">${opts(CONFIG.PLATFORMS,state.platform)}</select></div><div class="field"><label for="sponsor">Named business sponsor</label><input id="sponsor" value="${esc(state.sponsor)}"></div function scorePanel(sc){let status=sc.value<50?'Draft':sc.value<80?'Needs work':'Ready to submit',miss=sc.missing.sort((a,b)=>b.weight-a.weight)[0];return `<aside class="panel score" aria-label="Readiness score"><h2>${sc.value}% · ${status}</h2><div class="gauge" role="progressbar" aria-valuenow="${sc.value}" aria-valuemin="0" aria-valuemax="100"><i style="width:${sc.value}%"></i></div><p id="scorecopy" aria-live="polite">Your use case is ${sc.value}% ready. ${miss?`Add ${miss.label.toLowerCase()}.`:'It is ready to submit.'}</p><p class="note">${CONFIG.MESSAGES.provisional}</p></aside>`}function summaryPanel(sc){let text=sheet(sc);return `<div class="panel"><h2>${CONFIG.UI.summaryTitle}</h2><pre class="output" id="sheet">${esc(text)}</pre><button class="btn" id="copy">Copy to clipboard</button> <button class="btn" id="download">Download JSON</button> <button class="btn" id="print">Print / save as PDF</button><p class="muted">${CONFIG.MESSAGES.tracker}</p><button class="btn" id="reset">${CONFIG.MESSAGES.startOver}</button></div>`}function payload(sc){let p={};CONFIG.TRACKER_SCHEMA.forEach(k=>p[k]='');Object.assign(p,{'Use Case / Agent Name':state.pain.slice(0,80),'PSL':state.psl,'Status':'Backlog','Type':state.type,'Owner':state.role,'AI Tool / Product Surface':state.platform,'Description':state.pain,'Business Value':state.outcome,'Blockers':state.classification==='C4'||state.personal==='yes'?'Privacy/data review required':'','Next Steps':CONFIG.LIFECYCLE[2].gate,'Status Updates':`Readiness ${sc.value}%`});return p}function sheet(sc){return Object.entries(payload(sc)).map(([k,v])=>`${k}: ${v}`).join('\n')+`\n\nReadiness: ${sc.value}%`}function bindSummary(){ }document.addEventListener('click',e=>{if(e.target.id==='copy'){let t=$('#sheet').textContent;if(navigator.clipboard)navigator.clipboard.writeText(t);else{let x=document.createElement('textarea');x.value=t;document.body.append(x);x.select();document.execCommand('copy');x.remove()}}if(e.target.id==='download'){let
