function guideBox(g){
  var gu=D.links[g.urlKey]||"#", gs=g.soon||gu.indexOf("#")===0;
  var gin="<div class='gl'>"+esc(t("ciseGuide"))+(gs?"<span class='sn-tag'>"+esc(t("soon"))+"</span>":"")+"</div>"+
    "<h4>"+esc(tr(g.title))+"</h4><p>"+esc(tr(g.desc))+"</p>";
  return gs ? "<div class='gd'>"+gin+"</div>"
    : "<a class='gd' style='display:block' href='"+esc(gu)+"' target='_blank' rel='noopener noreferrer'>"+gin+
      "<span style='display:block;margin-top:8px;font-size:12px;font-weight:700;color:var(--blue)'>"+esc(t("open"))+" &rarr;</span></a>";
}
function toolCard(x){
  var avk=x.av==="open"?"openAccess":(x.av==="ciso"?"cisoOnly":"onRequest");
  var left="<div class='blk'><div class='bl'>"+esc(t("useFor"))+"</div><p>"+esc(tr(x.useFor))+"</p></div>"+
    "<div class='blk'><div class='bl'>"+esc(t("getAccess"))+"</div><p>"+esc(tr(x.accessShort))+"</p>"+
    (x.accessLinks?"<div class='lks'>"+x.accessLinks.map(function(l){
      return "<a class='lk' href='"+esc(l.url)+"' target='_blank' rel='noopener noreferrer'>"+esc(l.label)+" &#8599;</a>";}).join("")+"</div>":"")+
    (x.contact?"<p class='ctc'><b>"+esc(t("keyContact"))+" :</b> "+esc(x.contact)+"</p>":"")+"</div>"+
    (x.support?"<div class='blk'><div class='bl'>"+esc(t("support"))+"</div><div class='lks'>"+
      x.support.map(function(s){return s.url?"<a class='lk' href='"+esc(s.url)+"' target='_blank' rel='noopener noreferrer'>"+esc(tr(s.label))+" &#8599;</a>"
        :"<span class='lk mute'>"+esc(tr(s.label))+"</span>";}).join("")+"</div></div>":"");
  var s=x.start;
  var right="<div class='blk'><div class='strt'><div class='sl'>"+esc(t("startHere"))+"</div>"+
    "<h4>"+esc(tr(s.title))+"</h4><span style='display:flex;gap:6px;align-items:center;flex-wrap:wrap'>"+
    lv(s.level)+dur(s.duration)+"</span>"+
    (s.note?"<p style='font-size:11.5px;color:var(--soft);margin-top:6px'>"+esc(tr(s.note))+"</p>":"")+
    "<div class='lks'><a class='lk' href='"+esc(s.url)+"' target='_blank' rel='noopener noreferrer'>"+esc(t("openTraining"))+" &#8599;</a></div></div></div>";
  if(x.guide&&x.guide.afterStart) right+=guideBox(x.guide);
  if(x.more&&x.more.length)
    right+="<div class='blk' style='margin-top:15px'><div class='bl'>"+esc(t("thenGo"))+"</div><ul class='mlist'>"+
      x.more.map(moreItem).join("")+"</ul></div>";
  if(x.guide&&!x.guide.afterStart) right+=guideBox(x.guide);
  return "<div class='tl' id='tl-"+esc(x.id)+"'>"+
    "<button class='thd'><span class='ti i-"+esc(x.id)+"' aria-hidden='true'>"+esc(x.icon)+"</span>"+
    "<span class='tn'><span class='product'>"+esc(x.name)+"</span><h3>"+esc(tr(x.actionTitle))+"</h3><span>"+esc(tr(x.tagline))+"</span></span>"+
    "<span class='av a-"+esc(x.av)+"'>"+esc(t(avk))+"</span>"+
    "<span class='cv' aria-hidden='true'>&#9662;</span></button>"+
    "<div class='tb'><div class='tcols'><div>"+left+"</div><div>"+right+"</div></div></div></div>";
}
function sec2(){
  return "<div class='band b-dark'><div class='wrap'><section class='sec' id='s2'>"+
    "<div class='sh'><div class='sn'>2</div><div class='txt'>"+
    "<span class='eyebrow'>"+esc(t("stepLabel"))+" 2</span>"+
    "<h2>"+esc(t("s2"))+"</h2><p>"+esc(t("s2sub"))+"</p></div></div>"+
    "<p class='toolhint'><span class='b'>"+esc(t("startHere"))+"</span>"+esc(t("s2sub"))+"</p>"+
    "<div class='tools'>"+D.tools.map(toolCard).join("")+"</div></section></div></div>";
}
function sec3(){
  var h="<div class='band b-light'><div class='wrap'><section class='sec' id='s3'>"+"<div class='sh'><div class='sn'>3</div><div class='txt'><span class='eyebrow'>"+esc(t("stepLabel"))+" 3</span><h2>"+esc(t("otherLinks"))+"</h2></div></div>";
  h+="<p class='lbl'>"+esc(t("otherLinks"))+"<span class='hint'>"+esc(t("hoverHint2"))+"</span></p>"+
    "<div class='hubb'><span class='ic' aria-hidden='true'>&#11088;</span>"+
    "<div class='tx'><h3>"+esc(t("hubTitle"))+"</h3><p>"+esc(t("hubText"))+"</p></div>"+
    "<a class='cta' href='"+esc(D.links.hub)+"' target='_blank' rel='noopener noreferrer'>"+esc(t("hubCta"))+" &#8599;</a></div>"+
    "<div class='rsgrid'>"+D.further.map(function(f){
      return "<a class='rs' href='"+esc(D.links[f.urlKey])+"' target='_blank' rel='noopener noreferrer'>"+
        "<span class='hd'><span class='ic' aria-hidden='true'>"+esc(f.icon)+"</span>"+
        "<h4>"+esc(tr(f.title))+"</h4><span class='ext' aria-hidden='true'>&#8599;</span></span>"+
        (f.desc?"<div class='dsc'>"+esc(tr(f.desc))+"</div>":"")+"</a>";}).join("")+"</div>";
  return h+"</section></div></div>";
}
function renderHint(){
  var box=document.getElementById("sharepointHint");
  var txt=document.getElementById("sharepointHintText");
  if(!box||!txt)return;
  try{if(sessionStorage.getItem(HINT_KEY)==="1"){box.style.display="none";return;}}catch(e){}
  txt.textContent=t("sharepointHint");
  box.style.display="block";
  var close=document.getElementById("sharepointHintClose");
  if(close){close.onclick=function(){box.style.display="none";
    try{sessionStorage.setItem(HINT_KEY,"1");}catch(e){}};}
}
function render(){
  var m=D.meta;
  $("#bsub").textContent=t("subtitle");
  $("#llab").textContent=t("language");
  $("#ht").textContent=tr(D.hero.title);
  $("#hl").textContent=tr(D.hero.lead);
  $("#choice-slot").innerHTML=choicePanel();
  $("#main").innerHTML=sec1()+sec2()+sec3();
  $("#ft").innerHTML="<span>AI Learning Path &mdash; "+esc(m.org)+" &middot; CISO</span><span>"+
    esc(t("version"))+" "+esc(m.version)+" &middot; "+esc(t("updated"))+" "+esc(m.updated)+" &middot; "+
    esc(t("contact"))+" <a href='mailto:"+esc(m.contact)+"'>"+esc(m.contact)+"</a></span>";
  document.title=(m.title||"AI Learning Path")+" - CISO";
  bind();
  renderHint();
}
function bind(){
  Array.prototype.forEach.call(document.querySelectorAll(".st,.generic-step"),function(b){
    b.onclick=function(){var e=document.getElementById(b.getAttribute("data-go"));
      if(e)e.scrollIntoView({behavior:"smooth",block:"start"});};});
  Array.prototype.forEach.call(document.querySelectorAll(".thd"),function(b){
    b.onclick=function(){b.parentNode.classList.toggle("open");};});
  Array.prototype.forEach.call(document.querySelectorAll(".th,.rf"),function(c){
    c.onclick=function(e){if(!e.target.closest("a"))c.classList.toggle("on");};});
  var pg=$("#ptog");
  if(pg)pg.onclick=function(){$("#adv").classList.toggle("pon");};
  var cp=$("#cp");
  if(cp)cp.onclick=function(e){e.stopPropagation();var x=$("#pt").textContent;
    if(navigator.clipboard)navigator.clipboard.writeText(x);
    cp.textContent=t("copied");setTimeout(function(){cp.textContent=t("copy");},1500);};
}
var M1='<scr'+'ipt id="APP-DATA" type="application/json">',M2='</scr'+'ipt>';
function ovOpen(){
  $("#ov").classList.add("on");document.body.style.overflow="hidden";
  $("#ob").innerHTML=UNLOCK?edForm():pinForm();
  if(UNLOCK){$("#zone").value=JSON.stringify(D,null,2);wire();}
  else{$("#pin").focus();$("#pok").onclick=tryPin;
    $("#pin").onkeydown=function(e){if(e.key==="Enter")tryPin();};}
}
function pinForm(){return "<div class='pb'><p style='color:var(--soft);font-size:13.5px;margin-bottom:15px'>"+
  "Editing is restricted. Enter the PIN to continue.</p>"+
  "<input type='password' id='pin' placeholder='****' autocomplete='off'>"+
  "<div style='margin-top:13px'><button class='bt bt-p' id='pok'>Unlock</button></div>"+
  "<p id='pms' style='color:#8a1f2a;font-size:12.5px;margin-top:11px;display:none'>Wrong PIN.</p></div>";}
function tryPin(){if($("#pin").value===D.meta.editPin){UNLOCK=true;ovOpen();}
  else{$("#pms").style.display="block";$("#pin").value="";$("#pin").focus();}}
function edForm(){return "<div class='nb'><b>How it works:</b> edit the data, click <b>Check</b>, "+
  "then <b>Download</b>. You get an <b>AI-Learning-Path.html</b> file to drop in SharePoint.</div>"+
  "<div class='acts'><button class='bt bt-s' id='bc'>Check</button>"+
  "<button class='bt bt-p' id='bs'>Download the new page</button>"+
  "<button class='bt bt-s' id='bp'>Preview</button></div>"+
  "<textarea id='zone' spellcheck='false'></textarea><div id='msg'></div>";}
function wire(){$("#bc").onclick=function(){chk();};$("#bs").onclick=save;
  $("#bp").onclick=function(){var d=chk();if(d){D=d;initLang();render();ovClose();}};}
function ovClose(){$("#ov").classList.remove("on");document.body.style.overflow="";}
function say(x,ok){var e=$("#msg");e.textContent=x;e.className=ok?"ok":"ko";e.style.display="block";}
function chk(){try{var d=JSON.parse($("#zone").value);
  say("Valid. "+d.tools.length+" tools, "+d.core.length+" core themes.",true);return d;}
  catch(e){say("Error: "+e.message,false);return null;}}
function save(){var d=chk();if(!d)return;
  var i=PRISTINE.indexOf(M1),j=PRISTINE.indexOf(M2,i);
  if(i<0||j<0){say("Cannot rebuild the file.",false);return;}
  dl(PRISTINE.slice(0,i+M1.length)+"\n"+JSON.stringify(d,null,2)+"\n"+PRISTINE.slice(j),
     "AI-Learning-Path.html","text/html;charset=utf-8");
  say("Downloaded. Drop it in SharePoint.",true);}
function dl(c,n,ty){var b=new Blob(["\ufeff"+c],{type:ty}),u=URL.createObjectURL(b),a=document.createElement("a");
  a.href=u;a.download=n;document.body.appendChild(a);a.click();document.body.removeChild(a);
  setTimeout(function(){URL.revokeObjectURL(u);},1200);}
(function(){try{
  D=JSON.parse(document.getElementById("APP-DATA").textContent);
  initLang();render();
  $("#pen").onclick=ovOpen;$("#ox").onclick=ovClose;
  $("#ov").onclick=function(e){if(e.target.id==="ov")ovClose();};
  document.addEventListener("keydown",function(e){if(e.key==="Escape")ovClose();});
}catch(err){document.getElementById("main").innerHTML=
  "<div class='wrap' style='padding:30px 22px'><div style='background:#fef4f4;border:1px solid #f0c0c4;"+
  "color:#8a1f2a;padding:18px;border-radius:11px'><b>Data error:</b> "+esc(err.message)+"</div></div>";}
})();
</script>
</body>
</html>
